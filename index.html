<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DLS Liga</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#0a0e1a;
    --bg2:#0f1626;
    --card:#121b30;
    --cyan:#00d9ff;
    --gold:#ffb800;
    --text:#eef3fb;
    --muted:#7d8aa8;
    box-sizing:border-box;
  }
  *{box-sizing:inherit;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:radial-gradient(circle at 50% -10%, #16223d 0%, var(--bg) 55%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    min-height:100%;
  }
  header{
    display:flex;align-items:center;gap:10px;
    padding:18px 20px 8px;
  }
  .badge{
    width:34px;height:34px;border-radius:9px;
    background:linear-gradient(135deg,var(--cyan),#0066ff);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:15px;color:#001522;
  }
  header h1{
    font-size:17px;letter-spacing:.5px;font-weight:800;
  }
  header span{color:var(--cyan);}
  main{padding:10px 16px 28px;}
  .title{
    text-align:center;
    font-size:13px;
    letter-spacing:2px;
    color:var(--muted);
    margin:14px 0 18px;
  }
  .grid{display:flex;flex-direction:column;gap:14px;}
  .card{
    position:relative;
    border-radius:18px;
    padding:1.5px;
    background:linear-gradient(135deg,#ff5f6d,var(--cyan) 50%,#00ffa3);
    text-decoration:none;
  }
  .card-inner{
    border-radius:16.5px;
    background:linear-gradient(160deg,#182338,#0c1426);
    padding:26px 18px;
    min-height:120px;
    display:flex;align-items:flex-end;
    overflow:hidden;
    position:relative;
  }
  .card-inner::before{
    content:"";
    position:absolute;inset:0;
    background:var(--glow, radial-gradient(circle at 80% 20%, rgba(0,217,255,.25), transparent 60%));
  }
  .card-inner span{
    position:relative;font-size:21px;font-weight:800;
  }
  .card-inner small{
    position:absolute;top:14px;right:16px;font-size:22px;
  }
  #status{
    text-align:center;color:var(--muted);font-size:12px;padding:6px 20px 0;
  }
</style>
</head>
<body>

<header>
  <div class="badge">DLS</div>
  <h1>DLS <span>LIGA</span></h1>
</header>

<main>
  <div class="title">REJIMNI TANLANG</div>
  <div class="grid">
    <a class="card" href="#" data-section="ligalar">
      <div class="card-inner"><small>⚽</small><span>Ligalar</span></div>
    </a>
    <a class="card" href="#" data-section="worldcup">
      <div class="card-inner"><small>🏆</small><span>Jahon Chempionati</span></div>
    </a>
    <a class="card" href="#" data-section="ucl">
      <div class="card-inner"><small>⭐</small><span>Champions League</span></div>
    </a>
    <a class="card" href="#" data-section="division">
      <div class="card-inner"><small>🏟️</small><span>Divizion</span></div>
    </a>
  </div>
  <div id="status"></div>
</main>

<script>
  const tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg) { tg.ready(); tg.expand(); }

  document.querySelectorAll('.card').forEach(el => {
    el.addEventListener('click', (e) => {
      e.preventDefault();
      const section = el.dataset.section;
      // Hozircha bo'sh — har bir bo'lim keyingi bosqichda to'ldiriladi.
      document.getElementById('status').textContent =
        '"' + el.querySelector('span').textContent + '" bo\'limi tez orada qo\'shiladi.';
      if (tg) tg.HapticFeedback.impactOccurred('light');
    });
  });
</script>

</body>
</html>
