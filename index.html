<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DLS Liga</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#0a0e1a;
    --bg2:#0f1626;
    --card:#121b30;
    --cyan:#00d9ff;
    --gold:#ffb800;
    --text:#eef3fb;
    --muted:#7d8aa8;
    box-sizing:border-box;
  }
  *{box-sizing:inherit;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:radial-gradient(circle at 50% -10%, #16223d 0%, var(--bg) 55%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    min-height:100%;
  }
  header{
    display:flex;align-items:center;gap:10px;
    padding:18px 20px 8px;
  }
  .badge{
    width:34px;height:34px;border-radius:9px;
    background:linear-gradient(135deg,var(--cyan),#0066ff);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:15px;color:#001522;
  }
  header h1{
    font-size:17px;letter-spacing:.5px;font-weight:800;
  }
  header span{color:var(--cyan);}
  main{padding:10px 16px 28px;}
  .title{
    text-align:center;
    font-size:13px;
    letter-spacing:2px;
    color:var(--muted);
    margin:14px 0 18px;
  }
  .grid{display:flex;flex-direction:column;gap:14px;}
  .card{
    position:relative;
    border-radius:18px;
    padding:1.5px;
    background:linear-gradient(135deg,#ff5f6d,var(--cyan) 50%,#00ffa3);
    text-decoration:none;
  }
  .card-inner{
    border-radius:16.5px;
    background:linear-gradient(160deg,#182338,#0c1426);
    padding:26px 18px;
    min-height:120px;
    display:flex;align-items:flex-end;
    overflow:hidden;
    position:relative;
  }
  .card-inner::before{
    content:"";
    position:absolute;inset:0;
    background:var(--glow, radial-gradient(circle at 80% 20%, rgba(0,217,255,.25), transparent 60%));
  }
  .card-inner span{
    position:relative;font-size:21px;font-weight:800;
  }
  .card-inner small{
    position:absolute;top:14px;right:16px;font-size:22px;
  }
  #status{
    text-align:center;color:var(--muted);font-size:12px;padding:6px 20px 0;
  }
  .back{
    display:inline-flex;align-items:center;gap:4px;
    color:var(--cyan);font-weight:700;font-size:15px;
    background:none;border:none;padding:4px 0;margin-bottom:14px;
  }
  .league-banner{
    border-radius:18px;padding:1.5px;margin-bottom:16px;
    background:linear-gradient(135deg,#ff5f6d,var(--cyan) 50%,#00ffa3);
  }
  .league-banner-inner{
    border-radius:16.5px;padding:22px 18px;
    background:linear-gradient(160deg,#182338,#0c1426);
    position:relative;overflow:hidden;
  }
  .league-banner .badge-full{
    position:absolute;top:14px;left:16px;
    border:1px solid #ff5f6d;color:#ff5f6d;
    font-size:11px;font-weight:700;letter-spacing:1px;
    padding:3px 10px;border-radius:20px;
  }
  .league-banner h2{font-size:30px;letter-spacing:1px;margin:34px 0 18px;}
  .stat-row{display:flex;gap:10px;}
  .stat-box{
    flex:1;background:rgba(0,217,255,.06);border:1px solid rgba(0,217,255,.15);
    border-radius:12px;padding:12px 6px;text-align:center;
  }
  .stat-box b{display:block;font-size:22px;color:var(--cyan);}
  .stat-box span{font-size:10px;color:var(--muted);letter-spacing:.5px;}
  .register-btn{
    display:block;width:100%;margin-top:16px;padding:14px;border:none;border-radius:12px;
    background:linear-gradient(90deg,#6a5cff,var(--cyan));
    color:#001522;font-weight:800;font-size:15px;
  }
  .register-btn:disabled{background:#2a3346;color:var(--muted);}
  .league-row{
    display:flex;align-items:center;gap:12px;
    background:var(--card);border:1px solid rgba(255,255,255,.06);
    border-radius:14px;padding:14px;margin-bottom:10px;
  }
  .league-logo{
    width:38px;height:38px;border-radius:50%;background:#1c2740;
    display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;
  }
  .league-row-info{flex:1;}
  .league-row-info b{font-size:15px;display:block;}
  .league-row-info small{color:var(--muted);font-size:12px;}
  .pill{
    font-size:10px;font-weight:700;padding:4px 10px;border-radius:20px;letter-spacing:.5px;
  }
  .pill.full{border:1px solid #ff5f6d;color:#ff5f6d;}
  .pill.open{border:1px solid #00ffa3;color:#00ffa3;}
  .section-title{
    font-size:12px;letter-spacing:2px;color:var(--muted);margin:18px 0 10px;
  }
  .club-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .club-cell{
    background:var(--card);border:1px solid rgba(255,255,255,.06);
    border-radius:14px;padding:20px 8px;text-align:center;
  }
  .club-cell.taken{opacity:.35;}
  .club-cell .em{font-size:26px;display:block;margin-bottom:8px;}
  .club-cell b{font-size:13px;}
  .wc-banner{
    border-radius:18px;overflow:hidden;margin-bottom:14px;
    background:linear-gradient(160deg,#182338,#0c1426);
    border:1px solid rgba(255,184,0,.25);padding:22px 18px;position:relative;
  }
  .wc-banner .em-big{font-size:44px;display:block;text-align:center;margin-bottom:10px;}
  .wc-status{color:var(--cyan);font-size:12px;letter-spacing:1px;font-weight:700;}
  .wc-banner h2{font-size:26px;margin:8px 0 16px;}
  .note-box{
    margin-top:14px;background:rgba(255,184,0,.08);border:1px solid rgba(255,184,0,.25);
    border-radius:12px;padding:12px;text-align:center;color:var(--gold);font-weight:700;font-size:13px;
  }
  .note-text{color:var(--muted);font-size:12px;line-height:1.5;margin-top:10px;text-align:center;}
  .group-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .group-cell{
    background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:10px;
    padding:12px 0;text-align:center;font-weight:800;color:var(--muted);
  }
  .group-cell.active{border-color:var(--cyan);color:var(--cyan);background:rgba(0,217,255,.08);}
  .flag-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .flag-cell{
    display:flex;align-items:center;gap:10px;
    background:var(--card);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:14px;
  }
  .flag-cell .flag{font-size:22px;}
  .flag-cell b{font-size:14px;}
  .rules-box{
    background:var(--card);border:1px solid rgba(255,255,255,.06);border-radius:16px;
    padding:16px;margin-top:18px;font-size:13px;line-height:1.9;color:var(--muted);
  }
  .rules-box b{color:var(--text);}
  .div-badge{
    width:84px;height:84px;border-radius:50%;margin:6px auto 14px;
    background:conic-gradient(var(--cyan),#6a5cff,#00ffa3,var(--cyan));
    display:flex;align-items:center;justify-content:center;
  }
  .div-badge span{
    width:74px;height:74px;border-radius:50%;background:#0c1426;
    display:flex;align-items:center;justify-content:center;
    font-size:30px;font-weight:800;
  }
  .div-sub{text-align:center;color:var(--muted);font-size:12px;letter-spacing:1px;margin-bottom:14px;}
  .threshold-box{
    background:var(--card);border:1px solid rgba(255,255,255,.06);border-radius:14px;
    padding:14px;margin-top:14px;font-size:13px;line-height:2;
  }
  .threshold-box .up{color:#00ffa3;font-weight:700;}
  .threshold-box .stay{color:var(--gold);font-weight:700;}
  .threshold-box .down{color:#ff5f6d;font-weight:700;}
  .reg-box{
    background:linear-gradient(160deg,#182338,#0c1426);border:1px solid rgba(0,217,255,.2);
    border-radius:16px;padding:16px;margin-top:16px;
  }
  .reg-box h3{font-size:16px;margin-bottom:6px;}
  .reg-box p{color:var(--muted);font-size:12px;line-height:1.6;margin-bottom:12px;}
  .participant-row{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--card);border:1px solid rgba(255,255,255,.06);
    border-radius:12px;padding:10px 14px;margin-bottom:8px;font-size:13px;
  }
  .participant-row .uname{color:var(--muted);font-size:11px;}
  .cl-banner{
    border-radius:18px;padding:22px 18px;margin-bottom:16px;
    background:linear-gradient(160deg,#1a1650,#0c1426);
    border:1px solid rgba(106,92,255,.35);
  }
  .cl-tag{color:#a78bfa;font-size:12px;letter-spacing:2px;font-weight:700;}
  .cl-banner h2{font-size:26px;margin:8px 0 16px;}
  .status-btn{
    display:block;width:100%;margin-top:14px;padding:14px;border:none;border-radius:12px;
    background:linear-gradient(90deg,#6a5cff,var(--cyan));color:#001522;font-weight:800;font-size:14px;
  }
  .qualifier-row{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--card);border:1px solid rgba(255,255,255,.06);
    border-radius:12px;padding:12px 14px;margin-bottom:8px;font-size:13px;
  }
  .qualifier-row b{font-size:14px;}
  .qualifier-row small{color:var(--muted);display:block;font-size:11px;margin-top:2px;}
  .cl-points{color:var(--cyan);font-weight:800;font-size:15px;}
  .note-block{
    background:rgba(255,184,0,.07);border:1px solid rgba(255,184,0,.25);
    border-radius:14px;padding:14px;margin-top:18px;font-size:12.5px;line-height:1.9;color:var(--muted);
  }
  .note-block b{color:var(--gold);}
  .rules-list{margin-top:12px;font-size:12.5px;line-height:1.9;color:var(--muted);}
  .rules-list b{color:var(--text);}
</style>
</head>
<body>

<header>
  <div class="badge">DLS</div>
  <h1>DLS <span>LIGA</span></h1>
</header>

<main id="app"></main>

<script>
  const tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg) { tg.ready(); tg.expand(); }
  function haptic(){ if (tg) tg.HapticFeedback.impactOccurred('light'); }

  // --- Vaqtinchalik namunaviy ma'lumot (keyinroq admin panel/bazaga ulanadi) ---
  const LEAGUES = [
    { id:'laliga', name:'LaLiga', emoji:'🔴', current:20, max:20, season:5 },
    { id:'epl', name:'Premier Liga', emoji:'⚪', current:20, max:20, season:5 },
    { id:'bundesliga', name:'Bundesliga', emoji:'⚫', current:18, max:18, season:5 },
    { id:'ligue1', name:'Ligue 1', emoji:'🔵', current:14, max:18, season:5 },
  ];
  const CLUBS = ['Angers','Auxerre','Brest','Le Havre','Lens','Lille','Lorient','Lyon','Marseille','Metz','Monaco','Nantes','Nice','Paris FC','Paris SG','Rennes','Strasbourg','Toulouse'];

  const COUNTRIES = [
    ['Mexico','🇲🇽'],['South Africa','🇿🇦'],['South Korea','🇰🇷'],['Czech Republic','🇨🇿'],
    ['Brazil','🇧🇷'],['Argentina','🇦🇷'],['France','🇫🇷'],['Germany','🇩🇪'],
    ['Spain','🇪🇸'],['Italy','🇮🇹'],['England','🏴'],['Portugal','🇵🇹'],
    ['Netherlands','🇳🇱'],['Belgium','🇧🇪'],['Croatia','🇭🇷'],['Uruguay','🇺🇾'],
    ['Japan','🇯🇵'],['USA','🇺🇸'],['Canada','🇨🇦'],['Morocco','🇲🇦'],
    ['Senegal','🇸🇳'],['Ghana','🇬🇭'],['Nigeria','🇳🇬'],['Egypt','🇪🇬'],
    ['Poland','🇵🇱'],['Switzerland','🇨🇭'],['Denmark','🇩🇰'],['Sweden','🇸🇪'],
    ['Serbia','🇷🇸'],['Australia','🇦🇺'],['Iran','🇮🇷'],['Saudi Arabia','🇸🇦'],
    ['Qatar','🇶🇦'],['Ecuador','🇪🇨'],['Chile','🇨🇱'],['Colombia','🇨🇴'],
    ['Peru','🇵🇪'],['Costa Rica','🇨🇷'],['Tunisia','🇹🇳'],['Cameroon','🇨🇲'],
    ['Ukraine','🇺🇦'],['Turkey','🇹🇷'],['Austria','🇦🇹'],['Norway','🇳🇴'],
    ['Uzbekistan','🇺🇿'],['Jordan','🇯🇴'],['Wales','🏴'],['Scotland','🏴'],
  ];
  const GROUP_LETTERS = ['A','B','C','D','E','F','G','H','I','J','K','L'];
  function groupCountries(letter){
    const idx = GROUP_LETTERS.indexOf(letter);
    return COUNTRIES.slice(idx*4, idx*4+4);
  }

  // Divizion: 10 (eng past) dan 1 (eng yuqori) gacha. Har bosqich 4 o'yin, kuniga 2 tagacha.
  function divisionRules(d){
    if (d === 1)  return { promote: 6,  stayMin: null, stayMax: null, dropMax: 5, promoteLabel: "Ligalarga yo'llanma" };
    if (d === 2)  return { promote: 10, stayMin: 6, stayMax: 9, dropMax: 5 };
    if (d <= 4)   return { promote: 9,  stayMin: 6, stayMax: 8, dropMax: 5 };
    if (d <= 6)   return { promote: 8,  stayMin: 5, stayMax: 7, dropMax: 4 };
    return          { promote: 6,  stayMin: 3, stayMax: 5, dropMax: 2 };
  }
  const ME = { division: 8, played: 3, maxMatches: 4, points: 7 };
  const PARTICIPANTS = [
    ['Akhmadovich','@thecoko'], ['Abdurashid','@abdurashid_s7'], ['Shaxbozbek','@shox_pesserr'],
    ['Xurshidbek','@xakjaan_04'], ["Gnanzou Franck",'@Franck_24'],
  ];
  const API_BASE = 'https://dls-liga-telegram-bot--shaxa0609.replit.app';
  function currentTelegramId(){
    return tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : null;
  }
  const QUALIFIERS = [
    ['Xusanov Kamoliddin','LaLiga',1,105], ['23','LaLiga',2,105], ['"ISA"','LaLiga',3,90],
    ['Shaxbozbek','Premier Liga',1,98], ['Abdurashid','Premier Liga',2,92],
    ['Akhmadovich','Bundesliga',1,89], ['Xurshidbek','Bundesliga',2,81], ['n','Ligue 1',1,74],
  ];

  const app = document.getElementById('app');

  function renderHome(){
    app.innerHTML = `
      <div class="title">REJIMNI TANLANG</div>
      <div class="grid">
        <a class="card" href="#" data-section="ligalar"><div class="card-inner"><small>⚽</small><span>Ligalar</span></div></a>
        <a class="card" href="#" data-section="worldcup"><div class="card-inner"><small>🏆</small><span>Jahon Chempionati</span></div></a>
        <a class="card" href="#" data-section="ucl"><div class="card-inner"><small>⭐</small><span>Champions League</span></div></a>
        <a class="card" href="#" data-section="division"><div class="card-inner"><small>🏟️</small><span>Divizion</span></div></a>
      </div>
      <div id="status"></div>`;
    app.querySelectorAll('.card').forEach(el => {
      el.addEventListener('click', e => {
        e.preventDefault();
        haptic();
        if (el.dataset.section === 'ligalar') renderLeagueList();
        else if (el.dataset.section === 'worldcup') renderWorldCup('A');
        else if (el.dataset.section === 'division') renderDivision();
        else if (el.dataset.section === 'ucl') renderChampionsLeague();
        else document.getElementById('status').textContent =
          '"' + el.querySelector('span').textContent + '" bo\'limi tez orada qo\'shiladi.';
      });
    });
  }

  function renderLeagueList(){
    app.innerHTML = `
      <button class="back" id="btnBack">‹ Ortga</button>
      <div class="section-title">LIGA TANLASH</div>
      <div id="leagueRows"></div>`;
    document.getElementById('btnBack').onclick = () => { haptic(); renderHome(); };
    const rows = document.getElementById('leagueRows');
    LEAGUES.forEach(l => {
      const full = l.current >= l.max;
      const row = document.createElement('div');
      row.className = 'league-row';
      row.innerHTML = `
        <div class="league-logo">${l.emoji}</div>
        <div class="league-row-info"><b>${l.name}</b><small>${l.current}/${l.max} O'yinchilar</small></div>
        <span class="pill ${full ? 'full' : 'open'}">${full ? "TO'LIQ" : 'OCHIQ'}</span>`;
      row.onclick = () => { haptic(); renderLeagueDetail(l); };
      rows.appendChild(row);
    });
  }

  function renderLeagueDetail(l){
    const full = l.current >= l.max;
    app.innerHTML = `
      <button class="back" id="btnBack">‹ Ortga</button>
      <div class="league-banner"><div class="league-banner-inner">
        ${full ? '<span class="badge-full">TO\'LIQ</span>' : ''}
        <h2>${l.name}</h2>
        <div class="stat-row">
          <div class="stat-box"><b>${l.current}</b><span>O'YINCHILAR</span></div>
          <div class="stat-box"><b>${l.max}</b><span>MAKSIMAL</span></div>
          <div class="stat-box"><b>${l.season}</b><span>MAVSUM</span></div>
        </div>
        <button class="register-btn" id="btnRegister" ${full ? 'disabled' : ''}>Ro'yxatdan o'tish</button>
      </div></div>
      <div class="section-title">LIGADAGI KLUBLAR</div>
      <div class="club-grid" id="clubGrid"></div>`;
    document.getElementById('btnBack').onclick = () => { haptic(); renderLeagueList(); };
    const grid = document.getElementById('clubGrid');
    CLUBS.forEach((name, i) => {
      const taken = i < l.current;
      const cell = document.createElement('div');
      cell.className = 'club-cell' + (taken ? ' taken' : '');
      cell.innerHTML = `<span class="em">⚽</span><b>${name}</b>`;
      grid.appendChild(cell);
    });
    const btn = document.getElementById('btnRegister');
    if (btn && !full) {
      btn.onclick = () => {
        haptic();
        document.getElementById('status')?.remove();
        const note = document.createElement('div');
        note.id = 'status';
        note.textContent = "Ro'yxatdan o'tish jarayoni keyingi bosqichda ulanadi.";
        app.appendChild(note);
      };
    }
  }

  function renderWorldCup(activeLetter){
    app.innerHTML = `
      <button class="back" id="btnBack">‹ Ortga</button>
      <div class="wc-banner">
        <span class="em-big">🏆</span>
        <div class="wc-status">OCHIQ — RO'YXAT DAVOM ETMOQDA</div>
        <h2>${activeLetter} GURUH</h2>
        <div class="stat-row">
          <div class="stat-box"><b>4</b><span>JAMOALAR</span></div>
          <div class="stat-box"><b>4</b><span>MAKSIMAL</span></div>
          <div class="stat-box"><b>8</b><span>MAVSUM</span></div>
        </div>
        <div class="note-box">Divizion mavsumi hali yakunlanmagan</div>
        <div class="note-text">JCh'ga faqat Divizion reytingida top-48 ga kirganlar o'ta oladi. Ro'yxat Divizion mavsumi yakunlanganda shakllanadi.</div>
      </div>
      <div class="section-title">GURUH TANLASH</div>
      <div class="group-grid" id="groupGrid"></div>
      <div class="section-title">GURUHDAGI JAMOALAR</div>
      <div class="flag-grid" id="flagGrid"></div>
      <div class="rules-box">
        <b>Qoidalar</b><br>
        ▸ O'yin <b>8 daqiqa</b> davom etadi.<br>
        ▸ Ikkitalik himoya yoqish <b>mumkin emas</b>.<br>
        ▸ O'yinchilar holati <b>"Excellent"</b> bo'lishi kerak.<br>
        ▸ Extra time va penalti <b>yo'q</b>.<br>
        ▸ Dedline har kuni tungi soat <b>23:30</b> da.
      </div>`;
    document.getElementById('btnBack').onclick = () => { haptic(); renderHome(); };
    const gg = document.getElementById('groupGrid');
    GROUP_LETTERS.forEach(letter => {
      const cell = document.createElement('div');
      cell.className = 'group-cell' + (letter === activeLetter ? ' active' : '');
      cell.textContent = letter;
      cell.onclick = () => { haptic(); renderWorldCup(letter); };
      gg.appendChild(cell);
    });
    const fg = document.getElementById('flagGrid');
    groupCountries(activeLetter).forEach(([name, flag]) => {
      const cell = document.createElement('div');
      cell.className = 'flag-cell';
      cell.innerHTML = `<span class="flag">${flag}</span><b>${name}</b>`;
      fg.appendChild(cell);
    });
  }

  function renderDivision(){
    app.innerHTML = `<button class="back" id="btnBack">‹ Ortga</button><div id="divContent" style="text-align:center;color:var(--muted);padding:30px 0;">Yuklanmoqda...</div>`;
    document.getElementById('btnBack').onclick = () => { haptic(); renderHome(); };
    const uid = currentTelegramId();
    if (!uid) {
      document.getElementById('divContent').textContent = "Foydalanuvchi aniqlanmadi — Telegram ichida oching.";
      return;
    }
    fetch(`${API_BASE}/api/division/${uid}`)
      .then(res => res.json())
      .then(data => paintDivision(data))
      .catch(() => {
        document.getElementById('divContent').textContent = "Ma'lumotni yuklab bo'lmadi. Birozdan so'ng qayta urinib ko'ring.";
      });
  }

  function paintDivision(d){
    const r = divisionRules(d.division);
    const stayLine = r.stayMin === null
      ? ''
      : `<div><span class="stay">${r.stayMin}-${r.stayMax} ochko</span> — divizionda qolasiz</div>`;
    document.getElementById('divContent').outerHTML = `
      <div class="div-badge"><span>${d.division}</span></div>
      <div class="div-sub">JORIY DIVIZION</div>
      <div class="stat-row">
        <div class="stat-box"><b>${d.matches_played_cycle}/4</b><span>O'YINLAR</span></div>
        <div class="stat-box"><b>${d.points_cycle}</b><span>OCHKO</span></div>
        <div class="stat-box"><b>+3 / +1 / 0</b><span>G'.-D.-M.</span></div>
      </div>
      <div class="threshold-box">
        <div><span class="up">${r.promote}+ ochko</span> — ${r.promoteLabel || 'divizion ko\'tariladi'}</div>
        ${stayLine}
        <div><span class="down">0-${r.dropMax} ochko</span> — 1 divizion pastga tushadi</div>
      </div>
      <div class="reg-box">
        <h3>📝 Ro'yxat ochiq (17:00–20:00)</h3>
        <p>Qur'a 20:00 dan keyin o'tkaziladi, o'yin natijasi ertasi kuni 16:00 gacha kiritiladi.</p>
        <button class="register-btn" id="btnDivRegister" ${d.registered_today ? 'disabled' : ''}>
          ${d.registered_today ? "✅ Bugun ro'yxatdasiz" : "Ro'yxatdan o'tish"}
        </button>
      </div>
      <div id="divStatus" style="text-align:center;color:var(--muted);font-size:12px;margin-top:8px;"></div>`;
    const btn = document.getElementById('btnDivRegister');
    if (btn && !d.registered_today) {
      btn.onclick = () => {
        haptic();
        const uid = currentTelegramId();
        fetch(`${API_BASE}/api/division/register/${uid}`, { method: 'POST' })
          .then(res => res.json())
          .then(res => {
            document.getElementById('divStatus').textContent = res.message || (res.success ? "Ro'yxatdan muvaffaqiyatli o'tdingiz." : "Xatolik yuz berdi.");
            if (res.success) renderDivision();
          })
          .catch(() => { document.getElementById('divStatus').textContent = "Xatolik yuz berdi, qayta urinib ko'ring."; });
      };
    }
  }

  function renderChampionsLeague(){
    app.innerHTML = `
      <button class="back" id="btnBack">‹ Ortga</button>
      <div class="cl-banner">
        <div class="cl-tag">⭐ CHEMPIONLAR LIGASI</div>
        <h2>Qur'a kutilmoqda</h2>
        <div class="stat-row">
          <div class="stat-box"><b>36</b><span>KVALIFIKANT</span></div>
          <div class="stat-box"><b>36</b><span>KLUBLAR</span></div>
          <div class="stat-box"><b>8</b><span>TURLAR</span></div>
        </div>
        <button class="status-btn" disabled>Siz ishtirokchi emassiz</button>
      </div>
      <div class="section-title">KVALIFIKANTLAR (36/36)</div>
      <div id="qualifierList"></div>
      <div class="note-block">
        <b>MUHIM — ESDA TUTING</b><br>
        › Deadline — <b>23:30</b> (Toshkent). Shu vaqtda joriy tur yopiladi va keyingisi ochiladi.<br>
        › Deadlinegacha natija kiritilmagan o'yin <b>0:0 durang</b> bilan yopiladi.<br>
        › Natijani faqat <b>ochiq turda</b> kiritish mumkin.
      </div>
      <div class="rules-list">
        <b>UMUMIY QOIDALAR</b><br>
        › Liga mavsumi bo'yicha eng ko'p ochko to'plagan <b>36 ta</b> ishtirokchi qatnashadi.<br>
        › Guruhlar <b>yo'q</b> — barcha ishtirokchi yagona liga bosqichida.<br>
        › Har ishtirokchi <b>8 ta turli raqib</b> bilan <b>1 martadan</b> o'ynaydi.<br>
        › Kuniga <b>bitta tur</b> o'ynaladi.<br>
        › Ochko: g'alaba <b>3</b> · durang <b>1</b> · mag'lubiyat <b>0</b>.<br>
        › Saralash: ochko → gol farqi → urilgan gollar.<br>
        › 8 tur tugagach: <b>top-8</b> to'g'ridan setkaga, <b>9-24 o'rin</b> pley-in o'ynab 8 tasi setkaga qo'shiladi.
      </div>`;
    document.getElementById('btnBack').onclick = () => { haptic(); renderHome(); };
    const list = document.getElementById('qualifierList');
    QUALIFIERS.forEach(([name, league, pos, pts]) => {
      const row = document.createElement('div');
      row.className = 'qualifier-row';
      row.innerHTML = `<div><b>${name}</b><small>${league} · ${pos}-o'rin</small></div><span class="cl-points">${pts}</span>`;
      list.appendChild(row);
    });
  }

  renderHome();
</script>

</body>
</html>
